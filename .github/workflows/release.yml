name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_NAME: gadget-popups

jobs:
  build-and-gate:
    name: Build, gate and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build artifacts and run all gates (eslint / tsc / terser / idempotency / css)
        run: npm test
      - name: Compute sha256
        run: cd dist && sha256sum Gadget-popups.js Gadget-popups.css > sha256sums.txt && cd .. && cat dist/sha256sums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/Gadget-popups.js
            dist/Gadget-popups.css
            dist/sha256sums.txt
          if-no-files-found: error

  release:
    name: Create release and upload assets
    runs-on: ubuntu-latest
    needs: build-and-gate
    # 仅 tag push 发 release：workflow_dispatch 的 ref 是分支名，没有可发布的 tag，
    # 手动触发只用于验证构建门禁与 artifact 上传
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
      - name: Verify sha256
        run: cd artifact && sha256sum -c sha256sums.txt
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHA256_JS="$(grep 'Gadget-popups.js$' artifact/sha256sums.txt | cut -d' ' -f1)"
          SHA256_CSS="$(grep 'Gadget-popups.css$' artifact/sha256sums.txt | cut -d' ' -f1)"

          # 用 echo 逐行拼接 notes：多行字符串直接写在脚本里会把 YAML 块缩进
          # 带进 markdown（行首 4 空格即成代码块）
          {
            echo "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA} (tag ${TAG})."
            echo ""
            echo "- Gadget-popups.js sha256: \`${SHA256_JS}\`"
            echo "- Gadget-popups.css sha256: \`${SHA256_CSS}\`"
            echo "- Upstream sources: https://en.wikipedia.org/wiki/MediaWiki:Gadget-popups.js and https://en.wikipedia.org/wiki/MediaWiki:Gadget-navpop.css (see the artifact headers for the synced oldids)"
            echo "- To reproduce: clone the repository, run \`npm ci && npm test\`, then compare \`dist/Gadget-popups.js\` and \`dist/Gadget-popups.css\`."
          } > release-notes.md

          # 重跑幂等：release 已存在时 create 会失败，退化为 --clobber 重传 assets
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              artifact/Gadget-popups.js artifact/Gadget-popups.css artifact/sha256sums.txt --clobber
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              artifact/Gadget-popups.js artifact/Gadget-popups.css artifact/sha256sums.txt
          fi
