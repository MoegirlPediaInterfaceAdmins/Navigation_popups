name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_NAME: Gadget-popups.js
  OLD_REPO: MoegirlPediaInterfaceAdmins/MoegirlPediaInterfaceCodes
  OLD_REPO_PATH: src/gadgets/Navigation_popups/Gadget-popups.js

jobs:
  build-and-gate:
    name: Build, gate and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build artifact and run all gates (eslint / tsc / terser / idempotency)
        run: npm test
      - name: Compute sha256
        run: cd dist && sha256sum Gadget-popups.js > Gadget-popups.js.sha256 && cd .. && cat dist/Gadget-popups.js.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/Gadget-popups.js
            dist/Gadget-popups.js.sha256
          if-no-files-found: error

  sync-back:
    name: Open PR against the interface codes repo
    runs-on: ubuntu-latest
    needs: build-and-gate
    # DISABLED ON PURPOSE — falsy condition keeps this job skipped for now.
    # To enable:
    #   1. Have an org admin create a fine-grained PAT scoped to ONLY the
    #      MoegirlPediaInterfaceAdmins/MoegirlPediaInterfaceCodes repository with
    #      Contents: Read and write + Pull requests: Read and write.
    #   2. Store it as the secret OLD_REPO_TOKEN in this repository.
    #   3. Change the line below to: if: needs.build-and-gate.result == 'success'
    if: false
    env:
      GH_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
      - name: Push branch and open PR
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BRANCH="auto/navigation-popups/${TAG}"
          SHA256="$(cut -d' ' -f1 artifact/Gadget-popups.js.sha256)"
          SRC_COMMIT="${GITHUB_SHA}"

          (cd artifact && sha256sum -c Gadget-popups.js.sha256)

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${OLD_REPO}.git" old
          cd old
          git config user.name "navigation-popups-ci"
          git config user.email "navigation-popups-ci@users.noreply.github.com"
          cp "../artifact/${ARTIFACT_NAME}" "${OLD_REPO_PATH}"
          if git diff --quiet; then
            echo "Artifact is identical to ${OLD_REPO}@master — nothing to sync."
            exit 0
          fi
          git checkout -b "${BRANCH}"
          git add "${OLD_REPO_PATH}"
          git commit -m "chore(Gadget/Navigation_popups): sync Navigation popups artifact ${TAG}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo "${OLD_REPO}" \
            --base master \
            --head "${BRANCH}" \
            --title "chore(Gadget/Navigation_popups): sync Navigation popups artifact ${TAG}" \
            --body "This PR was generated by the [Navigation_popups](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}) release workflow.

          - Built from: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SRC_COMMIT} (tag ${TAG})
          - Artifact sha256: \`${SHA256}\`
          - Upstream source: https://en.wikipedia.org/wiki/MediaWiki:Gadget-popups.js (see the artifact header for the synced oldid)
          - To reproduce: clone the repository, run \`npm ci && npm test\`, then compare \`dist/Gadget-popups.js\`.

          The file is a build artifact — please review the source change in the Navigation_popups repository instead of editing it here."
