name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Build and quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build artifact and run all gates (eslint / tsc / terser / idempotency)
        run: npm test
      - name: Compute sha256
        run: cd dist && sha256sum Gadget-popups.js Gadget-popups.css > sha256sums.txt && cd .. && cat dist/sha256sums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gadget-popups
          path: |
            dist/Gadget-popups.js
            dist/Gadget-popups.css
            dist/sha256sums.txt
          if-no-files-found: error
